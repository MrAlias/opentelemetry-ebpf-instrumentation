name: Java Agent CI

on:
  push:
    branches: ["main", "release-*"]
  pull_request:
    branches: ["main", "release-*"]
    paths:
      - "pkg/internal/java/**"
      - "pkg/internal/javabridge/**"
      - "pkg/internal/ebpf/tpinjector/**"
      - "bpf/javabridge/**"
      - "bpf/maps/java_*.h"
      - "testdata/java-remote-parent-v1-vectors.txt"
      - "examples/apache-java-https/**"
      - ".dockerignore"
      - "javaagent.Dockerfile"
      - "dependencies.Dockerfile"
      - ".github/workflows/java-agent.yml"
      - ".github/actions/generate-bpf/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit, branch, or tag) to check out"
        required: false
        type: string

concurrency:
  group: java-agent-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: pkg/internal/java

jobs:
  generate-provider-bpf:
    name: Generate production-provider BPF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Generate BPF artifacts
        uses: ./.github/actions/generate-bpf
        with:
          artifact-name: java-provider-bpf-${{ github.run_id }}
          cache-key-prefix: go-build-java-provider-runtime

  build:
    name: Build and test (Java ${{ matrix.test-java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        test-java: [8, 11, 17, 21]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Gradle source of truth
        id: gradle-source
        working-directory: .
        run: |
          set -euo pipefail

          gradle_image="$(awk '$1=="FROM" && $4=="gradle-java" {print $2}' dependencies.Dockerfile)"
          if [[ -z "$gradle_image" ]]; then
            echo "Unable to find gradle-java image in dependencies.Dockerfile" >&2
            exit 1
          fi

          gradle_version="$(printf '%s' "$gradle_image" | sed -E 's#^gradle:([0-9.]+)-.*#\1#')"
          if [[ -z "$gradle_version" || "$gradle_version" == "$gradle_image" ]]; then
            echo "Unable to parse Gradle version from image: $gradle_image" >&2
            exit 1
          fi

          echo "image=$gradle_image" >> "$GITHUB_OUTPUT"
          echo "version=$gradle_version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ matrix.test-java }} for testing
        id: test-jdk
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.test-java }}

      - name: Set up JDK for running Gradle
        id: gradle-jdk
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: pkg/internal/java/.java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ steps.gradle-source.outputs.version }}
          cache-disabled: true

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Validate Apache-to-Java HTTPS harness
        if: matrix.test-java == 21
        working-directory: .
        run: |
          ./examples/apache-java-https/certs/generate_test.sh
          ./examples/apache-java-https/scripts/run_test.sh
          docker compose \
            --project-name obi-apache-java-https \
            --file examples/apache-java-https/docker-compose.yml \
            config --quiet

      - name: Check code formatting (Spotless)
        env:
          JAVA_HOME: ${{ steps.gradle-jdk.outputs.path }}
        run: gradle spotlessCheck --no-daemon --stacktrace

      - name: Build agent
        env:
          JAVA_HOME: ${{ steps.gradle-jdk.outputs.path }}
        run: gradle build -x test --no-daemon --stacktrace

      - name: Verify Docker build ignores local Java outputs
        if: matrix.test-java == 21
        working-directory: .
        run: |
          set -euo pipefail

          work_dir="$(mktemp -d)"
          trap 'rm -rf "${work_dir}"' EXIT
          mkdir -p "${work_dir}/clean-context" "${work_dir}/clean" "${work_dir}/dirty"
          git archive HEAD | tar -x -C "${work_dir}/clean-context"

          docker build \
            --output "type=local,dest=${work_dir}/clean" \
            --target export \
            -f "${work_dir}/clean-context/javaagent.Dockerfile" \
            "${work_dir}/clean-context"

          mkdir -p pkg/internal/java/extension/build/untracked
          printf 'must not affect Docker context\n' \
            > pkg/internal/java/extension/build/untracked/context-marker
          mkdir -p pkg/internal/java/loader/src/main/resources/agent
          printf 'stale generated agent must not affect Docker context\n' \
            > pkg/internal/java/loader/src/main/resources/agent/agent.zip
          docker build \
            --output "type=local,dest=${work_dir}/dirty" \
            --target export \
            -f javaagent.Dockerfile \
            .

          cmp "${work_dir}/clean/obi-java-agent.jar" "${work_dir}/dirty/obi-java-agent.jar"
          cmp "${work_dir}/clean/obi-otel-extension.jar" \
            "${work_dir}/dirty/obi-otel-extension.jar"

      - name: Run tests on JDK ${{ matrix.test-java }}
        env:
          JAVA_HOME: ${{ steps.gradle-jdk.outputs.path }}
          OBI_TEST_JAVA_HOME: ${{ steps.test-jdk.outputs.path }}
          OBI_TEST_JAVA_VERSION: ${{ matrix.test-java }}
        run: |
          cat > /tmp/obi-test-jvm.init.gradle <<'EOF'
          allprojects {
            tasks.withType(Test).configureEach {
              executable = System.getenv("OBI_TEST_JAVA_HOME") + "/bin/java"
            }
          }
          EOF

          gradle test -I /tmp/obi-test-jvm.init.gradle --no-daemon --stacktrace

      - name: Verify official Java agent compatibility
        id: official_agent_compatibility
        working-directory: .
        env:
          JAVA_HOME: ${{ steps.gradle-jdk.outputs.path }}
          OBI_TEST_JAVA_HOME: ${{ steps.test-jdk.outputs.path }}
          TEST_JAVA: ${{ matrix.test-java }}
        run: |
          set -Eeuo pipefail

          evidence_dir="testoutput/java-agent-compatibility/java-${TEST_JAVA}"
          mkdir -p -- "$evidence_dir"
          git rev-parse HEAD > "$evidence_dir/source-commit.txt"
          uname -a > "$evidence_dir/runner-uname.txt"
          "$OBI_TEST_JAVA_HOME/bin/java" -version \
            > "$evidence_dir/java-version.txt" 2>&1

          cat > /tmp/obi-agent-compatibility-jvm.init.gradle <<'EOF'
          allprojects {
            tasks.withType(Test).configureEach {
              executable = System.getenv("OBI_TEST_JAVA_HOME") + "/bin/java"
            }
          }
          EOF

          ./examples/apache-java-https/scripts/download-agent.sh \
            --distribution otel \
            --output /tmp/obi-agent-compatibility/otel/artifacts
          cp -- \
            /tmp/obi-agent-compatibility/otel/artifacts/official-javaagent.json \
            "$evidence_dir/opentelemetry-agent.json"
          ./examples/apache-java-https/scripts/download-agent.sh \
            --distribution splunk \
            --output /tmp/obi-agent-compatibility/splunk/artifacts
          cp -- \
            /tmp/obi-agent-compatibility/splunk/artifacts/official-javaagent.json \
            "$evidence_dir/splunk-agent.json"

          OBI_TEST_OTEL_AGENT=/tmp/obi-agent-compatibility/otel/artifacts/official-javaagent.jar \
          OBI_TEST_SPLUNK_AGENT=/tmp/obi-agent-compatibility/splunk/artifacts/official-javaagent.jar \
            gradle \
              -p pkg/internal/java \
              :extension:officialAgentRuntimeTest \
              -I /tmp/obi-agent-compatibility-jvm.init.gradle \
              --no-daemon \
              --stacktrace

      - name: Collect official Java agent compatibility evidence
        if: always()
        working-directory: .
        env:
          COMPATIBILITY_OUTCOME: ${{ steps.official_agent_compatibility.outcome }}
          OBI_TEST_JAVA_HOME: ${{ steps.test-jdk.outputs.path }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
          RUNNER_OPERATING_SYSTEM: ${{ runner.os }}
          TEST_JAVA: ${{ matrix.test-java }}
        run: |
          set -Eeuo pipefail

          evidence_dir="testoutput/java-agent-compatibility/java-${TEST_JAVA}"
          test_results="pkg/internal/java/extension/build/test-results/officialAgentRuntimeTest"
          evidence_status=0
          mkdir -p -- "$evidence_dir"

          if ! git rev-parse --verify HEAD > "$evidence_dir/source-commit.txt"; then
            printf 'Checked-out source revision is unavailable.\n' \
              > "$evidence_dir/source-commit-unavailable.txt"
          fi
          uname -a > "$evidence_dir/runner-uname.txt"
          if [[ -x "$OBI_TEST_JAVA_HOME/bin/java" ]]; then
            "$OBI_TEST_JAVA_HOME/bin/java" -version \
              > "$evidence_dir/java-version.txt" 2>&1
          else
            printf 'Configured test JVM is unavailable: %s\n' \
              "$OBI_TEST_JAVA_HOME" > "$evidence_dir/java-version-unavailable.txt"
          fi

          case "$COMPATIBILITY_OUTCOME" in
            success)
              cell_status=pass
              ;;
            failure)
              cell_status=fail
              ;;
            skipped|cancelled)
              cell_status=untested
              ;;
            *)
              printf 'Unexpected compatibility outcome: %s\n' \
                "$COMPATIBILITY_OUTCOME" >&2
              exit 1
              ;;
          esac

          if [[ -d "$test_results" ]]; then
            mkdir -p -- "$evidence_dir/test-results"
            cp -R -- "$test_results/." "$evidence_dir/test-results/"
          else
            printf 'Gradle produced no official-agent JUnit results.\n' \
              > "$evidence_dir/test-results-missing.txt"
          fi

          if [[ "$COMPATIBILITY_OUTCOME" == "success" ]]; then
            expected_results=(
              OfficialAgentCompatibilityTest
              OfficialAgentJettyRuntimeTest
              OfficialAgentNettyRuntimeTest
              OfficialAgentJava21ConcurrencyRuntimeTest
            )
            for result_class in "${expected_results[@]}"; do
              result_file="$test_results/TEST-io.opentelemetry.obi.java.extension.${result_class}.xml"
              if [[ ! -s "$result_file" || -L "$result_file" ]]; then
                printf 'Missing nonempty JUnit result: %s\n' "$result_file" \
                  >> "$evidence_dir/test-results-missing.txt"
                evidence_status=1
              fi
            done
            if ! python3 - "$TEST_JAVA" "$test_results" \
              > "$evidence_dir/junit-summary.txt" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          feature = int(sys.argv[1])
          directory = pathlib.Path(sys.argv[2])
          expected = {
              "OfficialAgentCompatibilityTest",
              "OfficialAgentJettyRuntimeTest",
              "OfficialAgentNettyRuntimeTest",
              "OfficialAgentJava21ConcurrencyRuntimeTest",
          }
          expected_skips = {8: 4, 11: 2, 17: 2, 21: 0}
          observed = set()
          totals = {"tests": 0, "skipped": 0, "failures": 0, "errors": 0}
          for path in sorted(directory.glob("TEST-*.xml")):
              name = path.name.removeprefix(
                  "TEST-io.opentelemetry.obi.java.extension."
              ).removesuffix(".xml")
              if name not in expected:
                  raise SystemExit(f"unexpected JUnit result: {path.name}")
              if name in observed:
                  raise SystemExit(f"duplicate JUnit result: {path.name}")
              observed.add(name)
              suite = ET.parse(path).getroot()
              for field in totals:
                  totals[field] += int(suite.attrib[field])
          if observed != expected:
              raise SystemExit(
                  f"incomplete JUnit classes: observed={sorted(observed)!r}"
              )
          if totals != {
              "tests": 8,
              "skipped": expected_skips[feature],
              "failures": 0,
              "errors": 0,
          }:
              raise SystemExit(f"unexpected JUnit totals: {totals!r}")
          print(
              "tests={tests} skipped={skipped} failures={failures} errors={errors}".format(
                  **totals
              )
          )
          PY
            then
              printf 'Official-agent JUnit evidence failed exact validation.\n' \
                >> "$evidence_dir/test-results-missing.txt"
              evidence_status=1
            fi
            for metadata in opentelemetry-agent.json splunk-agent.json; do
              if [[ ! -s "$evidence_dir/$metadata" || -L "$evidence_dir/$metadata" ]]; then
                printf 'Missing nonempty agent metadata: %s\n' "$metadata" \
                  >> "$evidence_dir/test-results-missing.txt"
                evidence_status=1
              fi
            done
            if [[ ! -s "$evidence_dir/source-commit.txt" ||
              ! -s "$evidence_dir/runner-uname.txt" ||
              ! -s "$evidence_dir/java-version.txt" ]]; then
              printf 'Successful cell is missing baseline provenance.\n' \
                >> "$evidence_dir/test-results-missing.txt"
              evidence_status=1
            fi
            if ((evidence_status != 0)); then
              cell_status=fail
            fi
          fi

          {
            printf 'format_version=1\n'
            printf 'matrix_revision=official-agent-runtime-v1\n'
            printf 'java_feature=%s\n' "$TEST_JAVA"
            printf 'runner_os=%s\n' "$RUNNER_OPERATING_SYSTEM"
            printf 'runner_arch=%s\n' "$RUNNER_ARCHITECTURE"
            printf 'status_scope=officialAgentRuntimeTest\n'
            printf 'status=%s\n' "$cell_status"
          } > "$evidence_dir/matrix-cell.properties"

          exit "$evidence_status"

      - name: Upload official Java agent compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-agent-compatibility-java-${{ matrix.test-java }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: testoutput/java-agent-compatibility/java-${{ matrix.test-java }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifacts
        if: matrix.test-java == 21
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obi-java-artifacts
          path: |
            pkg/internal/java/build/obi-java-agent.jar
            pkg/internal/java/build/obi-otel-extension.jar
          retention-days: 7

  production-provider-runtime:
    name: Production provider (Java ${{ matrix.test-java }}, ${{ matrix.platform.arch }})
    needs: [build, generate-provider-bpf]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test-java: [8, 11, 17, 21]
        platform:
          - runner: ubuntu-latest
            arch: amd64
            uname-arch: x86_64
            jni-entry: native/linux-amd64/libobijni.so
          - runner: ubuntu-24.04-arm
            arch: arm64
            uname-arch: aarch64
            jni-entry: native/linux-aarch64/libobijni.so
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Initialize production-provider evidence
        working-directory: .
        env:
          TEST_ARCH: ${{ matrix.platform.arch }}
          TEST_JAVA: ${{ matrix.test-java }}
        run: |
          set -Eeuo pipefail
          evidence_dir="testoutput/java-provider-runtime/${TEST_ARCH}/java-${TEST_JAVA}"
          mkdir -p -- "$evidence_dir"
          git rev-parse --verify 'HEAD^{commit}' > "$evidence_dir/source-commit.txt"
          uname -a > "$evidence_dir/runner-uname.txt"

      - name: Download generated BPF files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-provider-bpf-${{ github.run_id }}

      - name: Download packaged Java bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: obi-java-artifacts
          path: ${{ runner.temp }}/obi-java-artifacts

      - name: Set up JDK ${{ matrix.test-java }}
        id: provider-jdk
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.test-java }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          go-version-file: go.mod
          cache: true

      - name: Install runtime feature-probe tools
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bpftool jq

      - name: Probe production-provider kernel features
        id: provider-features
        continue-on-error: true
        working-directory: .
        env:
          TEST_ARCH: ${{ matrix.platform.arch }}
          TEST_JAVA: ${{ matrix.test-java }}
        run: |
          set -Eeuo pipefail
          evidence_dir="testoutput/java-provider-runtime/${TEST_ARCH}/java-${TEST_JAVA}"
          feature_status=supported
          reason=compatible
          if [[ ! -r /sys/fs/cgroup/cgroup.controllers ]]; then
            feature_status=unsupported
            reason=cgroup_v2_unavailable
          elif [[ ! -s /sys/kernel/btf/vmlinux ]]; then
            feature_status=unsupported
            reason=kernel_btf_unavailable
          elif ! sudo bpftool feature probe kernel full 2>&1 \
            | tee "$evidence_dir/bpftool-feature.txt" >/dev/null; then
            feature_status=unsupported
            reason=privileged_bpftool_probe_failed
          fi
          {
            printf 'probe=bpftool_feature_probe_kernel_full\n'
            printf 'status=%s\n' "$feature_status"
            printf 'reason=%s\n' "$reason"
            printf '%s\n' \
              'final_support_decision=selected_go_runtime_feature_probes_and_non_skipping_tests' \
              'version_inference=disabled'
          } > "$evidence_dir/kernel-feature.properties"
          [[ "$feature_status" == supported ]]

      - name: Run production BPF/JNI provider fixtures
        id: provider-runtime
        if: steps.provider-features.outcome == 'success'
        working-directory: .
        env:
          EXPECTED_JNI_ENTRY: ${{ matrix.platform.jni-entry }}
          EXPECTED_UNAME_ARCH: ${{ matrix.platform.uname-arch }}
          JAVA_HOME: ${{ steps.provider-jdk.outputs.path }}
          TEST_ARCH: ${{ matrix.platform.arch }}
          TEST_JAVA: ${{ matrix.test-java }}
        run: |
          set -Eeuo pipefail
          evidence_dir="testoutput/java-provider-runtime/${TEST_ARCH}/java-${TEST_JAVA}"
          agent_path="$RUNNER_TEMP/obi-java-artifacts/obi-java-agent.jar"
          test_binary="$RUNNER_TEMP/java-provider-${TEST_ARCH}-java-${TEST_JAVA}.test"
          root_tmp="$RUNNER_TEMP/java-provider-root-${TEST_ARCH}-java-${TEST_JAVA}"
          runtime_status=0
          resource_status=0
          runtime_classification=fail

          [[ "$(uname -m)" == "$EXPECTED_UNAME_ARCH" ]]
          [[ -s "$agent_path" && ! -L "$agent_path" ]]
          "$JAVA_HOME/bin/jar" tf "$agent_path" \
            | grep -Fx -- "$EXPECTED_JNI_ENTRY" \
            > "$evidence_dir/jni-entry.txt"
          "$JAVA_HOME/bin/java" -XshowSettings:properties -version \
            > "$evidence_dir/java-version.txt" 2>&1
          sha256sum "$agent_path" > "$evidence_dir/java-agent.sha256"
          install -d -m 1777 -- "$root_tmp"

          test_pattern='^(TestJavaRemoteParentPrimaryJVMFaults|TestJavaRemoteParentPrimaryJVMDirectSSLSocket|TestJavaRemoteParentNestedCgroupLifecycle|TestJavaRemoteParentCgroupLinkProcessDeathCleanup|TestJavaRemoteParentCgroupPartialAttachRollback)$'
          expected_tests=(
            TestJavaRemoteParentPrimaryJVMFaults
            TestJavaRemoteParentPrimaryJVMDirectSSLSocket
            TestJavaRemoteParentNestedCgroupLifecycle
            TestJavaRemoteParentCgroupLinkProcessDeathCleanup
            TestJavaRemoteParentCgroupPartialAttachRollback
          )
          if [[ "$TEST_JAVA" == 21 ]]; then
            test_pattern='^(TestJavaRemoteParentPrimaryJVMFaults|TestJavaRemoteParentPrimaryJVMDirectSSLSocket|TestJavaRemoteParentGenericJVMDirectSSLSocket|TestJavaRemoteParentNestedCgroupLifecycle|TestJavaRemoteParentCgroupLinkProcessDeathCleanup|TestJavaRemoteParentCgroupPartialAttachRollback)$'
            expected_tests+=(TestJavaRemoteParentGenericJVMDirectSSLSocket)
          fi
          printf '%s\n' "${expected_tests[@]}" \
            > "$evidence_dir/selected-tests.txt"

          go test \
            -c \
            -tags=privileged_tests \
            -o "$test_binary" \
            ./pkg/internal/ebpf/tpinjector
          chmod 0700 -- "$test_binary"
          sha256sum "$test_binary" > "$evidence_dir/test-binary.sha256"

          snapshot_bpf_resources() {
            local -r label="$1"
            local kind=""
            for kind in map prog link; do
              sudo bpftool -j "$kind" show \
                | jq -S 'sort_by(.id)' \
                > "$evidence_dir/${label}-${kind}.json"
            done
          }
          snapshot_bpf_resources before

          set +e
          (
            cd -- pkg/internal/ebpf/tpinjector
            sudo env -i \
              HOME=/root \
              LANG=C \
              LC_ALL=C \
              PATH="$JAVA_HOME/bin:/usr/local/go/bin:/usr/bin:/bin" \
              TMPDIR="$root_tmp" \
              TZ=UTC \
              OBI_JAVA_REMOTE_PARENT_AGENT_JAR="$agent_path" \
              OBI_REQUIRE_CGROUP_TOPOLOGY=1 \
              "$test_binary" \
                -test.count=3 \
                -test.timeout=20m \
                -test.v \
                -test.run "$test_pattern"
          ) 2>&1 | tee "$evidence_dir/privileged-tests.log"
          runtime_status="${PIPESTATUS[0]}"
          set -e

          snapshot_bpf_resources after
          {
            for kind in map prog link; do
              before="$(jq 'length' "$evidence_dir/before-${kind}.json")"
              after="$(jq 'length' "$evidence_dir/after-${kind}.json")"
              jq -n \
                --slurpfile before "$evidence_dir/before-${kind}.json" \
                --slurpfile after "$evidence_dir/after-${kind}.json" \
                '($before[0] | map(.id)) as $before_ids |
                 [$after[0][] |
                  select(.id as $id | ($before_ids | index($id) | not))]' \
                > "$evidence_dir/residual-${kind}.json"
              new_after="$(jq 'length' "$evidence_dir/residual-${kind}.json")"
              printf '%s_before=%s\n%s_after=%s\n%s_new_after=%s\n' \
                "$kind" "$before" "$kind" "$after" "$kind" "$new_after"
              if (( new_after > 0 )); then
                resource_status=1
              fi
            done
            printf 'growth_check=%s\n' \
              "$([[ "$resource_status" == 0 ]] && printf pass || printf fail)"
          } > "$evidence_dir/resource-growth.properties"

          if grep -Eq -- '^[[:space:]]*--- SKIP:' \
            "$evidence_dir/privileged-tests.log"; then
            runtime_classification=unsupported
            runtime_status=1
          elif (( runtime_status == 0 && resource_status == 0 )); then
            runtime_classification=pass
            for test_name in "${expected_tests[@]}"; do
              pass_count="$(grep -Ec -- \
                "^[[:space:]]*--- PASS: ${test_name} \\(" \
                "$evidence_dir/privileged-tests.log" || true)"
              if [[ "$pass_count" != 3 ]]; then
                printf 'Expected three PASS records for %s, got %s\n' \
                  "$test_name" "$pass_count" >&2
                runtime_classification=fail
                runtime_status=1
              fi
            done
          fi
          {
            printf 'classification=%s\n' "$runtime_classification"
            printf 'test_status=%s\n' "$runtime_status"
            printf 'resource_status=%s\n' "$resource_status"
            printf 'repeat_count=3\n'
          } > "$evidence_dir/runtime-outcome.properties"
          (( runtime_status == 0 && resource_status == 0 ))

      - name: Collect production-provider matrix evidence
        if: always()
        working-directory: .
        env:
          FEATURE_OUTCOME: ${{ steps.provider-features.outcome }}
          JAVA_HOME: ${{ steps.provider-jdk.outputs.path }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
          RUNNER_OPERATING_SYSTEM: ${{ runner.os }}
          RUNTIME_OUTCOME: ${{ steps.provider-runtime.outcome }}
          TEST_ARCH: ${{ matrix.platform.arch }}
          TEST_JAVA: ${{ matrix.test-java }}
        run: |
          set -Eeuo pipefail
          evidence_dir="testoutput/java-provider-runtime/${TEST_ARCH}/java-${TEST_JAVA}"
          evidence_status=0
          cell_status=untested
          mkdir -p -- "$evidence_dir"

          if [[ -f "$evidence_dir/kernel-feature.properties" ]] &&
            grep -Fxq 'status=unsupported' \
              "$evidence_dir/kernel-feature.properties"; then
            cell_status=unsupported
            evidence_status=1
          elif [[ -f "$evidence_dir/runtime-outcome.properties" ]] &&
            grep -Fxq 'classification=unsupported' \
              "$evidence_dir/runtime-outcome.properties"; then
            cell_status=unsupported
            evidence_status=1
          elif [[ "$FEATURE_OUTCOME" == success && "$RUNTIME_OUTCOME" == success ]]; then
            cell_status=pass
          elif [[ "$RUNTIME_OUTCOME" == failure || "$FEATURE_OUTCOME" == failure ]]; then
            cell_status=fail
            evidence_status=1
          fi

          if [[ -x "${JAVA_HOME:-}/bin/java" ]]; then
            "$JAVA_HOME/bin/java" -XshowSettings:properties -version \
              > "$evidence_dir/java-version.txt" 2>&1
          else
            printf '%s\n' 'Configured JVM was not available to the evidence collector.' \
              > "$evidence_dir/java-version-unavailable.txt"
          fi
          if ! git rev-parse --verify 'HEAD^{commit}' \
            > "$evidence_dir/source-commit.txt"; then
            printf '%s\n' 'Checked-out source revision is unavailable.' \
              > "$evidence_dir/source-commit-unavailable.txt"
          fi
          uname -a > "$evidence_dir/runner-uname.txt"
          {
            printf 'format_version=1\n'
            printf 'matrix_revision=production-provider-runtime-v1\n'
            printf 'java_feature=%s\n' "$TEST_JAVA"
            printf 'architecture=%s\n' "$TEST_ARCH"
            printf 'runner_os=%s\n' "$RUNNER_OPERATING_SYSTEM"
            printf 'runner_arch=%s\n' "$RUNNER_ARCHITECTURE"
            printf 'repository=%s\n' "${GITHUB_REPOSITORY:-unavailable}"
            printf 'workflow_ref=%s\n' "${GITHUB_WORKFLOW_REF:-unavailable}"
            printf 'run_id=%s\n' "${GITHUB_RUN_ID:-unavailable}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT:-unavailable}"
            printf 'status_scope=production_bpf_jni_provider_runtime\n'
            printf 'status=%s\n' "$cell_status"
          } > "$evidence_dir/matrix-cell.properties"
          exit "$evidence_status"

      - name: Verify production-provider source remained clean
        if: always()
        working-directory: .
        run: |
          set -Eeuo pipefail
          status="$(git status --porcelain=v1 --untracked-files=all -- . ':!testoutput')"
          if [[ -n "$status" ]]; then
            printf '%s\n' 'CI source changed during provider validation:' >&2
            printf '%s\n' "$status" >&2
            exit 1
          fi

      - name: Upload production-provider evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-provider-runtime-${{ matrix.platform.arch }}-java-${{ matrix.test-java }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: testoutput/java-provider-runtime/${{ matrix.platform.arch }}/java-${{ matrix.test-java }}
          if-no-files-found: error
          retention-days: 14
