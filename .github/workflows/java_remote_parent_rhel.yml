name: Java remote-parent kernel compatibility preflight
run-name: Java remote-parent kernel matrix @ ${{ inputs.ref || github.sha }}

on:
  push:
    branches: [agent/java-remote-parent-bridge]
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact lowercase 40-hex Git commit to validate"
        required: true
        type: string

concurrency:
  group: java-remote-parent-kernel-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: ${{ matrix.kernel_id }} packaged-JVM transport preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # RHEL 8 remains explicitly unknown: it is not promoted into this
        # support-claiming campaign without a passing runtime feature probe.
        kernel_id:
          - 5.10-lts
          - 5.15-lts
          - 6.1-lts
          - 6.6-lts
          - 6.12-lts
          - rhel9.6
    env:
      CAMPAIGN_OUTPUT: testoutput/java-remote-parent-${{ matrix.kernel_id }}-kernel-sockopt
      OBI_VM_KERNEL_ID: ${{ matrix.kernel_id }}
      SAFE_CELL_PARENT: /tmp/issue11-${{ matrix.kernel_id }}-${{ github.run_id }}-${{ github.run_attempt }}
      SAFE_CELL_OUTPUT: /tmp/issue11-${{ matrix.kernel_id }}-${{ github.run_id }}-${{ github.run_attempt }}/cell
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Bind selected revision to an immutable commit
        env:
          SELECTED_REVISION: ${{ inputs.ref || github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$SELECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "$SELECTED_REVISION" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - uses: ./.github/actions/free-disk
        with:
          docker-prune: 'false'

      - name: Generate BPF artifacts
        uses: ./.github/actions/generate-bpf
        with:
          artifact-name: java-remote-parent-bpf-${{ matrix.kernel_id }}-${{ github.run_id }}
          cache-key-prefix: go-build-java-remote-parent-kernel-${{ matrix.kernel_id }}

      - name: Run Java bridge ABI tests
        run: |
          set -Eeuo pipefail
          test_pattern='^(TestRecord|TestRequest|TestSampled|TestVersion|TestValidRemoteParent)'
          mkdir -p -- "$CAMPAIGN_OUTPUT"
          git rev-parse HEAD \
            | tee "$CAMPAIGN_OUTPUT/source-commit.txt"
          go test -list "$test_pattern" ./pkg/internal/javabridge \
            | awk '/^Test/ { print }' \
            | tee "$CAMPAIGN_OUTPUT/abi-selected-tests.txt"
          mapfile -t selected_tests < "$CAMPAIGN_OUTPUT/abi-selected-tests.txt"
          if (( ${#selected_tests[@]} == 0 )); then
            printf '%s\n' 'ABI test pattern selected no tests' >&2
            exit 1
          fi
          go test \
            -count=1 \
            -v \
            -run "$test_pattern" \
            ./pkg/internal/javabridge 2>&1 \
            | tee "$CAMPAIGN_OUTPUT/abi-tests.log"
          if grep -Eq -- '^[[:space:]]*--- SKIP:' "$CAMPAIGN_OUTPUT/abi-tests.log"; then
            printf '%s\n' 'A selected ABI test skipped' >&2
            exit 1
          fi
          for test_name in "${selected_tests[@]}"; do
            if ! grep -Fq -- "--- PASS: ${test_name} " "$CAMPAIGN_OUTPUT/abi-tests.log"; then
              printf 'Selected ABI test did not report PASS: %s\n' "$test_name" >&2
              exit 1
            fi
          done

      - name: Validate transport benchmark artifact checks
        run: |
          set -Eeuo pipefail
          go test \
            -count=1 \
            -run '^(TestPackagedJVMBenchmarkArtifactV2StrictContract|TestPackagedJVMBenchmarkArtifactV2RejectsSemanticMutations|TestDecodePackagedJVMBenchmarkArtifactV2RejectsStructuralMutations)$' \
            ./pkg/internal/ebpf/tpinjector
          bash internal/test/vm/run-java-remote-parent-rhel_test.sh

      - name: Build Java bridge probe artifact
        run: |
          set -Eeuo pipefail
          artifact_dir="${CAMPAIGN_OUTPUT}/java-artifacts"
          mkdir -p -- "$artifact_dir"
          docker build \
            --output "type=local,dest=${artifact_dir}" \
            --target export \
            -f javaagent.Dockerfile \
            .
          test -s "${artifact_dir}/obi-java-agent.jar"
          sha256sum "${artifact_dir}/obi-java-agent.jar" \
            | tee "${CAMPAIGN_OUTPUT}/java-agent.sha256"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86

      - name: Read digest-pinned kernel metadata
        id: kernel-metadata
        run: |
          set -Eeuo pipefail
          if [[ ! "$OBI_VM_KERNEL_ID" =~ ^[a-z0-9][a-z0-9._-]{0,31}$ ]]; then
            printf 'Invalid kernel ID: %s\n' "$OBI_VM_KERNEL_ID" >&2
            exit 1
          fi
          lvh_tag="$(OBI_KERNEL_ID="$OBI_VM_KERNEL_ID" yq \
            '.kernels[] | select(.id == strenv(OBI_KERNEL_ID)) | .lvh_tag' \
            internal/test/vm/kernels.yaml)"
          digest="$(OBI_KERNEL_ID="$OBI_VM_KERNEL_ID" yq \
            '.kernels[] | select(.id == strenv(OBI_KERNEL_ID)) | .digest' \
            internal/test/vm/kernels.yaml)"
          if [[ ! "$lvh_tag" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
            printf 'Missing or invalid LVH tag for %s: %s\n' \
              "$OBI_VM_KERNEL_ID" "$lvh_tag" >&2
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Invalid LVH digest for %s: %s\n' \
              "$OBI_VM_KERNEL_ID" "$digest" >&2
            exit 1
          fi
          printf 'lvh_tag=%s\n' "$lvh_tag" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          {
            printf 'kernel_id=%s\n' "$OBI_VM_KERNEL_ID"
            printf 'lvh_tag=%s\n' "$lvh_tag"
            printf 'digest=%s\n' "$digest"
            printf '%s\n' \
              'selection=digest_pinned_matrix' \
              'support_decision=runtime_feature_probes_not_kernel_version'
          } | tee "$CAMPAIGN_OUTPUT/kernel-source.properties"

      - name: Resolve digest-pinned kernel
        id: kernel
        uses: ./.github/actions/setup-lvh-kernel
        with:
          kernel-id: ${{ matrix.kernel_id }}
          lvh-tag: ${{ steps.kernel-metadata.outputs.lvh_tag }}

      - name: Verify resolved kernel digest
        env:
          EXPECTED_LVH_DIGEST: ${{ steps.kernel-metadata.outputs.digest }}
        run: |
          set -Eeuo pipefail
          buildinfo="internal/test/vm/lvh/out/vmlinuz-${OBI_VM_KERNEL_ID}-amd64.buildinfo"
          resolved_digest="$(yq '.lvh_digest' "$buildinfo")"
          if [[ "$resolved_digest" != "$EXPECTED_LVH_DIGEST" ]]; then
            printf 'Resolved LVH digest %s, expected %s\n' \
              "$resolved_digest" "$EXPECTED_LVH_DIGEST" >&2
            exit 1
          fi

      - name: Run packaged-JVM transport preflight in VM
        id: vm-preflight
        env:
          KERNEL: ${{ steps.kernel.outputs.kernel }}
          MODULES_DIR: ${{ steps.kernel.outputs.modules-dir }}
        run: |
          set -Eeuo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          install -d -m 0700 "$CAMPAIGN_OUTPUT"
          rm -f -- testoutput/success
          vm_workdir="$(mktemp -d -- "$RUNNER_TEMP/java-remote-parent-kernel-vm.XXXXXX")"
          chmod 0700 "$vm_workdir"
          launch_status=0
          set +e
          sudo make -C internal/test/vm \
            WORKDIR="$vm_workdir" \
            KERNEL="$KERNEL" \
            MODULES_DIR="$MODULES_DIR" \
            ARCH=amd64 \
            JAVA_REMOTE_PARENT_KERNEL_ID="$OBI_VM_KERNEL_ID" \
            TARGET_TEST=run-java-remote-parent-rhel-kernel-sockopt-vm \
            2>&1 | tee "$CAMPAIGN_OUTPUT/vm-console.log"
          launch_status="${PIPESTATUS[0]}"
          set -e
          ownership_status=0
          sudo chown -R -- "$runner_uid:$runner_gid" testoutput || ownership_status=$?
          sudo chown -R -- "$runner_uid:$runner_gid" "$vm_workdir" || ownership_status=$?
          cleanup_status=0
          rm -rf -- "$vm_workdir" || cleanup_status=$?

          cell_status=fail
          if (( launch_status == 0 && ownership_status == 0 && cleanup_status == 0 )) &&
            [[ -f testoutput/success ]]; then
            cell_status=pass
          elif [[ -f "$CAMPAIGN_OUTPUT/kernel-feature.properties" ]] &&
            grep -Fxq 'status=untested' \
              "$CAMPAIGN_OUTPUT/kernel-feature.properties"; then
            cell_status=untested
          elif [[ -f "$CAMPAIGN_OUTPUT/kernel-feature.properties" ]] &&
            grep -Fxq 'status=unsupported' \
              "$CAMPAIGN_OUTPUT/kernel-feature.properties"; then
            cell_status=unsupported
          elif [[ -f "$CAMPAIGN_OUTPUT/privileged-tests.log" ]] &&
            grep -Eq -- '^[[:space:]]*--- SKIP:' \
              "$CAMPAIGN_OUTPUT/privileged-tests.log"; then
            cell_status=unsupported
          fi
          {
            printf 'format_version=1\n'
            printf 'matrix_revision=java-remote-parent-kernel-v1\n'
            printf 'kernel_id=%s\n' "$OBI_VM_KERNEL_ID"
            printf 'architecture=amd64\n'
            printf 'repository=%s\n' "${GITHUB_REPOSITORY:-unavailable}"
            printf 'workflow_ref=%s\n' "${GITHUB_WORKFLOW_REF:-unavailable}"
            printf 'run_id=%s\n' "${GITHUB_RUN_ID:-unavailable}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT:-unavailable}"
            printf 'status_scope=packaged_jvm_transport_preflight\n'
            printf 'status=%s\n' "$cell_status"
            printf '%s\n' \
              'support_decision=runtime_feature_probes_and_required_non_skipping_tests' \
              'version_inference=disabled'
          } > "$CAMPAIGN_OUTPUT/matrix-cell.properties"

          if (( launch_status != 0 )); then
            exit "$launch_status"
          fi
          (( ownership_status == 0 )) || exit "$ownership_status"
          (( cleanup_status == 0 )) || exit "$cleanup_status"
          [[ -f testoutput/success ]]

      - name: Verify CI source remained clean
        if: always()
        run: |
          set -Eeuo pipefail
          status="$(git status --porcelain=v1 --untracked-files=all -- . ':!testoutput')"
          if [[ -n "$status" ]]; then
            printf '%s\n' 'CI source changed during kernel validation:' >&2
            printf '%s\n' "$status" >&2
            exit 1
          fi

      - name: Project sanitized issue 11 kernel cell
        id: safe-cell
        if: steps.vm-preflight.outcome == 'success'
        run: |
          set -Eeuo pipefail
          install -d -m 0700 -- "$SAFE_CELL_PARENT"
          campaign_output="$(readlink -f -- "$CAMPAIGN_OUTPUT")"
          buildinfo="$(readlink -f -- \
            "internal/test/vm/lvh/out/vmlinuz-${OBI_VM_KERNEL_ID}-amd64.buildinfo")"
          config="$(readlink -f -- \
            "internal/test/vm/lvh/out/vmlinuz-${OBI_VM_KERNEL_ID}-amd64.config")"
          ./examples/apache-java-https/scripts/project-retained-issue11-evidence.sh \
            cell-v1 "$campaign_output" "$buildinfo" "$config" \
            "$SAFE_CELL_OUTPUT"
          (CDPATH='' cd / && bash "$SAFE_CELL_OUTPUT/verify.sh" >/dev/null)

      - name: Upload sanitized issue 11 kernel cell
        if: steps.safe-cell.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue11-kernel-cell-${{ matrix.kernel_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SAFE_CELL_OUTPUT }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

      - name: Upload kernel packaged-JVM transport evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-remote-parent-${{ matrix.kernel_id }}-kernel-sockopt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            internal/test/vm/lvh/out/vmlinuz-${{ matrix.kernel_id }}-amd64.buildinfo
            internal/test/vm/lvh/out/vmlinuz-${{ matrix.kernel_id }}-amd64.config
            testoutput/java-remote-parent-${{ matrix.kernel_id }}-kernel-sockopt
          if-no-files-found: error
          retention-days: 14

  aggregate-safe-matrix:
    name: Aggregate bounded issue 11 kernel matrix
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CELL_ROOT: /tmp/issue11-cells-${{ github.run_id }}-${{ github.run_attempt }}
      MATRIX_PARENT: /tmp/issue11-matrix-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout matrix projector authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Bind matrix authority to the selected immutable commit
        env:
          SELECTED_REVISION: ${{ inputs.ref || github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$SELECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "$SELECTED_REVISION" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Download six sanitized cells
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: issue11-kernel-cell-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CELL_ROOT }}
          merge-multiple: false

      - name: Project bounded issue 11 matrix
        id: matrix
        run: |
          set -Eeuo pipefail
          install -d -m 0700 -- "$MATRIX_PARENT"
          prefix="$CELL_ROOT/issue11-kernel-cell-"
          suffix="-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cells=(
            "${prefix}5.10-lts${suffix}"
            "${prefix}5.15-lts${suffix}"
            "${prefix}6.1-lts${suffix}"
            "${prefix}6.6-lts${suffix}"
            "${prefix}6.12-lts${suffix}"
            "${prefix}rhel9.6${suffix}"
          )
          expected="$(printf '%s\n' "${cells[@]##*/}" | LC_ALL=C sort)"
          observed="$(find -- "$CELL_ROOT" -mindepth 1 -maxdepth 1 \
            -type d -printf '%f\n' | LC_ALL=C sort)"
          [[ "$observed" == "$expected" ]]
          matrix_name="$(
            ./examples/apache-java-https/scripts/project-retained-issue11-evidence.sh \
              matrix-name-v1 "${cells[@]}"
          )"
          matrix_output="$MATRIX_PARENT/$matrix_name"
          ./examples/apache-java-https/scripts/project-retained-issue11-evidence.sh \
            matrix-v1 "${cells[@]}" "$matrix_output"
          (CDPATH='' cd / && bash "$matrix_output/verify.sh" >/dev/null)
          printf 'output_directory=%s\n' "$matrix_output" >> "$GITHUB_OUTPUT"

      - name: Upload bounded issue 11 matrix
        if: steps.matrix.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue11-kernel-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.matrix.outputs.output_directory }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
