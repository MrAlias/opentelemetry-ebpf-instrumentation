name: Markdown

on:
  push:
    branches:
      - "**"
    paths:
      - "**.md"
  pull_request:
    paths:
      - "**.md"

concurrency:
  group: markdown-check-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changedfiles:
    name: changed files
    runs-on: ubuntu-latest
    outputs:
      md_count: ${{ steps.changes.outputs.md_count }}
      md_paths: ${{ steps.changes.outputs.md_paths }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Get changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          AFTER_SHA: ${{ github.event.after || github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT is required}"
          changed_file="$(mktemp)"
          trap 'rm -f -- "$changed_file"' EXIT

          printf '%s\n' "Detecting changed markdown files..."

          require_commit() {
            local -r revision="$1"
            local -r label="$2"

            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || {
              printf 'Invalid %s revision identity: %q\n' "$label" "$revision" >&2
              exit 1
            }
            git cat-file -e "${revision}^{commit}" 2>/dev/null || {
              printf 'Required %s commit is unavailable: %s\n' \
                "$label" "$revision" >&2
              exit 1
            }
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            require_commit "$BASE_SHA" "pull-request base"
            require_commit "$HEAD_SHA" "pull-request head"
            [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 && \
              "$HEAD_SHA" != 0000000000000000000000000000000000000000 ]] || {
              printf '%s\n' "Pull-request revisions must be nonzero" >&2
              exit 1
            }
            [[ "$(git rev-parse 'HEAD^{commit}')" == "$HEAD_SHA" ]] || {
              printf '%s\n' "Checkout does not match pull-request head" >&2
              exit 1
            }
            git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null || {
              printf '%s\n' "Pull-request revisions have no merge base" >&2
              exit 1
            }
            printf 'Running in pull_request context\nBase SHA: %s\nHead SHA: %s\n' \
              "$BASE_SHA" "$HEAD_SHA"
            git diff --name-only --diff-filter=ACMRT -z \
              "$BASE_SHA...$HEAD_SHA" -- '*.md' >"$changed_file"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            require_commit "$AFTER_SHA" "push after"
            [[ "$AFTER_SHA" != 0000000000000000000000000000000000000000 ]] || {
              printf '%s\n' "Push after revision must be nonzero" >&2
              exit 1
            }
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              printf 'Invalid push before revision identity: %q\n' "$BEFORE_SHA" >&2
              exit 1
            }
            [[ "$(git rev-parse 'HEAD^{commit}')" == "$AFTER_SHA" ]] || {
              printf '%s\n' "Checkout does not match push after revision" >&2
              exit 1
            }
            printf 'Running in push context\nBefore SHA: %s\nAfter SHA: %s\n' \
              "$BEFORE_SHA" "$AFTER_SHA"
            if [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              git ls-tree -r -z --name-only "$AFTER_SHA" |
                while IFS= read -r -d '' path; do
                  if [[ "$path" == *.md ]]; then
                    printf '%s\0' "$path"
                  fi
                done >"$changed_file"
            else
              require_commit "$BEFORE_SHA" "push before"
              git diff --name-only --diff-filter=ACMRT -z \
                "$BEFORE_SHA" "$AFTER_SHA" -- '*.md' >"$changed_file"
            fi
          else
            printf 'Unsupported event type: %s\n' "$EVENT_NAME" >&2
            exit 1
          fi

          declare -a detected_paths=()
          declare -a markdown_paths=()
          mapfile -d '' -t detected_paths <"$changed_file"
          for path in "${detected_paths[@]}"; do
            [[ "$path" == NOTICES* ]] && continue
            [[ -n "$path" && "$path" == *.md && "$path" != /* && \
              "$path" != ../* && "$path" != */../* && \
              "$path" != *$'\n'* && "$path" != *$'\r'* ]] || {
              printf 'Unsafe changed Markdown path: %q\n' "$path" >&2
              exit 1
            }
            [[ -f "$path" && ! -L "$path" ]] || {
              printf 'Changed Markdown target is not a regular repository file: %q\n' \
                "$path" >&2
              exit 1
            }
            markdown_paths+=("$path")
            printf 'Markdown file changed: %q\n' "$path"
          done

          if (( ${#markdown_paths[@]} == 0 )); then
            printf 'md_count=0\nmd_paths=\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          delimiter="__OBI_CHANGED_MARKDOWN_PATHS__"
          while :; do
            delimiter_collision=false
            for path in "${markdown_paths[@]}"; do
              if [[ "$path" == "$delimiter" ]]; then
                delimiter_collision=true
                break
              fi
            done
            [[ "$delimiter_collision" == false ]] && break
            delimiter="_$delimiter"
          done
          {
            printf 'md_count=%d\n' "${#markdown_paths[@]}"
            printf 'md_paths<<%s\n' "$delimiter"
            printf '%s\n' "${markdown_paths[@]}"
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"

  lint:
    name: lint markdown files
    runs-on: ubuntu-latest
    needs: changedfiles
    if: ${{ needs.changedfiles.outputs.md_count != '0' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate and encode lint targets
        id: targets
        env:
          EXPECTED_COUNT: ${{ needs.changedfiles.outputs.md_count }}
          MARKDOWN_PATHS: ${{ needs.changedfiles.outputs.md_paths }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT is required}"
          [[ "$EXPECTED_COUNT" =~ ^[1-9][0-9]*$ ]] || {
            printf 'Invalid changed Markdown count: %q\n' "$EXPECTED_COUNT" >&2
            exit 1
          }

          declare -a markdown_paths=()
          declare -a markdown_targets=()
          mapfile -t markdown_paths <<<"$MARKDOWN_PATHS"
          (( ${#markdown_paths[@]} == EXPECTED_COUNT && EXPECTED_COUNT > 0 )) || {
            printf 'Expected %s changed Markdown targets, received %d\n' \
              "$EXPECTED_COUNT" "${#markdown_paths[@]}" >&2
            exit 1
          }
          for path in "${markdown_paths[@]}"; do
            [[ -n "$path" && "$path" == *.md && "$path" != /* && \
              "$path" != ../* && "$path" != */../* && \
              "$path" != *$'\n'* && "$path" != *$'\r'* && \
              -f "$path" && ! -L "$path" ]] || {
              printf 'Invalid Markdown lint target: %q\n' "$path" >&2
              exit 1
            }
            markdown_targets+=(":./$path")
          done
          (( ${#markdown_targets[@]} > 0 )) || {
            printf '%s\n' 'Changed Markdown set produced zero lint targets' >&2
            exit 1
          }

          delimiter="__OBI_MARKDOWNLINT_GLOBS__"
          {
            printf 'globs<<%s\n' "$delimiter"
            printf '%s\n' "${markdown_targets[@]}"
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
          printf 'Validated %d Markdown lint targets\n' "${#markdown_targets[@]}"
      - name: Run linter
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .markdownlint-cli2.yaml
          fix: false
          globs: |
            ${{ steps.targets.outputs.globs }}
