ServerRoot "/usr/local/apache2"
Listen 127.0.0.1:18080
ServerName apache-proxy
PidFile "/tmp/httpd.pid"
ErrorLog /proc/self/fd/2
LogLevel info

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule unixd_module modules/mod_unixd.so

# Keep the worker set fixed so socket stress does not race process discovery.
ServerLimit 8
StartServers 8
ThreadsPerChild 32
MaxRequestWorkers 256
MinSpareThreads 64
MaxSpareThreads 256
MaxConnectionsPerChild 0

User daemon
Group daemon

LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

SSLProxyEngine On
SSLProxyVerify require
SSLProxyCheckPeerName On
SSLProxyCheckPeerExpire On
SSLProxyCACertificateFile "/run/obi-demo/certs/ca.crt"
SSLProxyProtocol -all +${BACKEND_TLS_PROTOCOL}

ProxyRequests Off
ProxyPreserveHost Off
ProxyPass "/api/coalesced-source" "http://127.0.0.1:18081/api/coalesced-source" connectiontimeout=3 timeout=10 disablereuse=On retry=0
ProxyPassReverse "/api/coalesced-source" "http://127.0.0.1:18081/api/coalesced-source"
ProxyPass "/api/tls-boundary/split" "https://localhost:18445/api/tls-boundary/split" connectiontimeout=3 timeout=10 disablereuse=On retry=0
ProxyPassReverse "/api/tls-boundary/split" "https://localhost:18445/api/tls-boundary/split"
ProxyPass "/api/tls-boundary/coalesced" "https://localhost:18446/api/tls-boundary/coalesced" connectiontimeout=3 timeout=10 keepalive=On max=1 smax=1 ttl=30 retry=0
ProxyPassReverse "/api/tls-boundary/coalesced" "https://localhost:18446/api/tls-boundary/coalesced"
ProxyPass "/api/netty-server" "https://localhost:18444/api/netty-server" connectiontimeout=3 timeout=10 keepalive=On retry=0
ProxyPassReverse "/api/netty-server" "https://localhost:18444/api/netty-server"
ProxyPass "/" "https://localhost:18443/" connectiontimeout=3 timeout=10 keepalive=On retry=0
ProxyPassReverse "/" "https://localhost:18443/"

<Location "/api/obi-flags">
    RequestHeader unset traceparent
</Location>

<LocationMatch "^/obi-(diagnostics|transport-configuration)">
    Require all denied
</LocationMatch>

<Proxy "https://localhost:18443/*">
    Require all granted
</Proxy>

<Proxy "https://localhost:18444/*">
    Require all granted
</Proxy>

<Proxy "https://localhost:18445/*">
    Require all granted
</Proxy>

<Proxy "https://localhost:18446/*">
    Require all granted
</Proxy>

<Proxy "http://127.0.0.1:18081/*">
    Require all granted
</Proxy>
