x-demo-labels: &demo-labels
  io.opentelemetry.obi.apache-java-https.owner: acceptance-demo-v1

services:
  socket-init:
    image: httpd:2.4.68-alpine@sha256:1b766f17b84026429b7cb243317b142921b24432336e798bc881c43f45ed9567
    network_mode: none
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - chown 0:65534 /var/run/obi && chmod 0750 /var/run/obi
    volumes:
      - java-remote-parent-socket:/var/run/obi
    labels: *demo-labels
    restart: "no"

  trace-receiver:
    build:
      context: ../..
      dockerfile: examples/apache-java-https/tracecheck/Dockerfile
    image: obi-apache-java-https-tracecheck:local
    network_mode: host
    environment:
      LISTEN_ADDRESS: 127.0.0.1:14318
      MAX_SPANS: "10000"
      MAX_VALUE_BYTES: "4096"
      MAX_RETAINED_BYTES: "67108864"
    labels: *demo-labels
    restart: "no"

  java-backend:
    build:
      context: .
      dockerfile: java/Dockerfile
    image: obi-apache-java-https-backend:local
    network_mode: host
    environment:
      HTTPS_PORT: "18443"
      NETTY_HTTPS_PORT: "18444"
      TLS_BOUNDARY_SPLIT_HTTPS_PORT: "18445"
      TLS_BOUNDARY_COALESCED_HTTPS_PORT: "18446"
      TLS_KEYSTORE_PATH: /run/obi-demo/certs/server.p12
      TLS_KEYSTORE_PASSWORD: changeit
      TLS_PROTOCOL: ${BACKEND_TLS_PROTOCOL:-TLSv1.3}
      TLS_RECEIVE_BOUNDARY_FIXTURE_ENABLED: "1"
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS_VALUE--javaagent:/otel/official-javaagent.jar}
      OTEL_JAVAAGENT_EXTENSIONS: ${OTEL_JAVAAGENT_EXTENSIONS_VALUE-/otel/obi-otel-extension.jar}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS_VALUE:-obi,tracecontext,baggage}
      OTEL_OBI_REMOTE_PARENT_ENABLED: ${EXTENSION_ENABLED:-true}
      OTEL_TRACES_SAMPLER: always_on
      OTEL_SERVICE_NAME: java-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:14318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_BSP_SCHEDULE_DELAY: "${OTEL_BSP_SCHEDULE_DELAY_VALUE:-100}"
      OTEL_BSP_EXPORT_TIMEOUT: "5000"
      OTEL_JAVA_EXPORTER_OTLP_RETRY_DISABLED: "${OTEL_JAVA_EXPORTER_OTLP_RETRY_DISABLED_VALUE:-false}"
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS: x-obi-demo-id
    volumes:
      - ./.runtime/certs/server.p12:/run/obi-demo/certs/server.p12:ro
      - java-remote-parent-socket:/var/run/obi
    depends_on:
      socket-init:
        condition: service_completed_successfully
      trace-receiver:
        condition: service_started
    labels: *demo-labels
    restart: "no"

  coalesced-source:
    image: obi-apache-java-https-tracecheck:local
    network_mode: host
    entrypoint:
      - /coalesced-source
    environment:
      LISTEN_ADDRESS: 127.0.0.1:18081
      BACKEND_ADDRESS: 127.0.0.1:18444
      BACKEND_TLS_PROTOCOL: ${BACKEND_TLS_PROTOCOL:-TLSv1.3}
      CA_PATH: /run/obi-demo/certs/ca.crt
    volumes:
      - ./.runtime/certs/ca.crt:/run/obi-demo/certs/ca.crt:ro
    depends_on:
      java-backend:
        condition: service_started
    labels: *demo-labels
    restart: "no"

  apache-proxy:
    image: httpd:2.4.68-alpine@sha256:1b766f17b84026429b7cb243317b142921b24432336e798bc881c43f45ed9567
    network_mode: host
    environment:
      BACKEND_TLS_PROTOCOL: ${BACKEND_TLS_PROTOCOL:-TLSv1.3}
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./.runtime/certs/ca.crt:/run/obi-demo/certs/ca.crt:ro
    depends_on:
      - java-backend
      - coalesced-source
    labels: *demo-labels
    restart: "no"

  obi:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        RELEASE_VERSION: apache-java-https-demo
        RELEASE_REVISION: local
    image: obi-apache-java-https:local
    init: false
    command:
      - --config=/config/obi.yaml
    network_mode: host
    pid: host
    privileged: true
    stop_grace_period: 30s
    environment:
      OTEL_EBPF_JAVA_REMOTE_PARENT_TRANSPORT: ${BRIDGE_TRANSPORT:-getsockopt}
      OTEL_EBPF_JAVA_REMOTE_PARENT_SOCKET_PATH: /var/run/obi/java-remote-parent.sock
      OTEL_EBPF_JAVA_REMOTE_PARENT_SOCKET_GROUP_ID: "65534"
      OTEL_EBPF_JAVA_REMOTE_PARENT_TIMEOUT: 50ms
      OTEL_EBPF_JAVA_REMOTE_PARENT_TTL: ${REMOTE_PARENT_TTL:-30s}
      OTEL_EBPF_JAVA_REMOTE_PARENT_RETRIEVAL_TTL: ${REMOTE_PARENT_RETRIEVAL_TTL:-0s}
      OTEL_EBPF_BPF_CONTEXT_PROPAGATION: ${CONTEXT_PROPAGATION:-tcp}
      OTEL_EBPF_LOG_LEVEL: ${OBI_LOG_LEVEL:-info}
      OTEL_EBPF_BPF_DEBUG: "false"
      OTEL_EBPF_PROTOCOL_DEBUG_PRINT: "false"
    volumes:
      - ./configs/obi.yaml:/config/obi.yaml:ro
      - java-remote-parent-socket:/var/run/obi
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /sys/kernel/security:/sys/kernel/security:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
    depends_on:
      apache-proxy:
        condition: service_started
      java-backend:
        condition: service_started
      socket-init:
        condition: service_completed_successfully
      trace-receiver:
        condition: service_started
    labels: *demo-labels
    restart: "no"

  scenario:
    image: obi-apache-java-https-tracecheck:local
    network_mode: host
    entrypoint:
      - /trace-scenario
    profiles:
      - tools
    labels: *demo-labels

  benchmark:
    image: obi-apache-java-https-tracecheck:local
    network_mode: host
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - type: bind
        source: ${BENCHMARK_CA_SOURCE:-./.runtime/certs/ca.crt}
        target: /benchmark-ca.crt
        read_only: true
        bind:
          create_host_path: false
    entrypoint:
      - /trace-benchmark
    profiles:
      - tools
    labels: *demo-labels

  map-pressure:
    image: obi-apache-java-https-tracecheck:local
    network_mode: none
    privileged: true
    entrypoint:
      - /map-pressure
    profiles:
      - tools
    labels: *demo-labels

  map-state:
    image: obi-apache-java-https-tracecheck:local
    network_mode: none
    privileged: true
    entrypoint:
      - /map-state
    profiles:
      - tools
    labels: *demo-labels

  generation-fault:
    image: obi-apache-java-https-tracecheck:local
    network_mode: none
    privileged: true
    read_only: true
    entrypoint:
      - /generation-fault
    volumes:
      - type: bind
        source: ${GENERATION_FAULT_CONTROL_SOURCE:-./.runtime/generation-fault-control}
        target: /control
        bind:
          create_host_path: false
    profiles:
      - tools
    labels: *demo-labels

  bridge-fault:
    image: obi-apache-java-https-tracecheck:local
    network_mode: none
    user: "0:0"
    environment:
      FAULT_MODE: ${FAULT_MODE:-alternating}
    entrypoint:
      - /fault-bridge
      - --socket
      - /var/run/obi/java-remote-parent.sock
      - --matching-valid-takes
      - ${MATCHING_VALID_TAKES:-1}
    volumes:
      - java-remote-parent-socket:/var/run/obi
    profiles:
      - tools
    labels: *demo-labels

  security-probe:
    image: obi-apache-java-https-tracecheck:local
    network_mode: none
    user: "0:0"
    entrypoint:
      - /security-probe
      - --socket
      - /var/run/obi/java-remote-parent.sock
      - --mode
      - ${SECURITY_PROBE_MODE:-abuse}
      - --timeout
      - ${SECURITY_PROBE_TIMEOUT:-60s}
    volumes:
      - java-remote-parent-socket:/var/run/obi
    profiles:
      - tools
    labels: *demo-labels

  # The endpoint-replacement control needs a writable root-owned view so it
  # can replace the path. Unix peer-credential controls use the hardened
  # sibling below instead.
  security-unix-sibling-probe:
    image: obi-apache-java-https-tracecheck:local
    network_mode: none
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint:
      - /security-probe
      - --socket
      - /var/run/obi/java-remote-parent.sock
      - --mode
      - abuse-race
      - --timeout
      - ${SECURITY_PROBE_TIMEOUT:-60s}
    volumes:
      - java-remote-parent-socket:/var/run/obi:ro
    profiles:
      - tools
    labels: *demo-labels

volumes:
  java-remote-parent-socket:
    labels: *demo-labels

networks:
  default:
    labels: *demo-labels
