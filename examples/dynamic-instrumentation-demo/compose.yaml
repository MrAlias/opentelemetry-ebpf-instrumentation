name: obi-dynamic-instrumentation-demo

services:
  checkout:
    build:
      context: ./app
    ports:
      - "127.0.0.1:18081:18080"
    environment:
      PORT: "18080"
      JAVA_INVENTORY_URL: http://inventory-java:18082/availability
    depends_on:
      - inventory-java

  inventory-java:
    build:
      context: ./java-service
    ports:
      - "127.0.0.1:18084:18082"
    environment:
      PORT: "18082"
      NODE_CATALOG_URL: http://inventory-node:18083/availability
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=obi-dynamic-demo
      OTEL_SERVICE_NAME: inventory-java
    depends_on:
      - collector
      - inventory-node

  inventory-node:
    build:
      context: ./node-service
    ports:
      - "127.0.0.1:18085:18083"
    environment:
      PORT: "18083"

  loadgen:
    build:
      context: ./loadgen
    environment:
      CHECKOUT_URL: http://checkout:18080/checkout
      REQUEST_INTERVAL: 250ms
    depends_on:
      - checkout
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.0@sha256:78439f7f7cf3c97122846c13a832e060c6c7ef67dcc814dccf0a5f3f78393a93
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  collector:
    image: quay.io/signalfx/splunk-otel-collector:0.161.0@sha256:6cc58d3dca1e76464a043e060aca36fb44e0c7e283e7ad900aec873646014b84
    command: ["--config=/etc/otel/collector-config.yaml"]
    environment:
      SPLUNK_REALM: ${SPLUNK_REALM:?copy .env.example to .env and set SPLUNK_REALM}
      SPLUNK_ACCESS_TOKEN: ${SPLUNK_ACCESS_TOKEN:?copy .env.example to .env and set SPLUNK_ACCESS_TOKEN}
    volumes:
      - ./collector-config.yaml:/etc/otel/collector-config.yaml:ro
    depends_on:
      - tempo

  obi:
    image: obi-dynamic-instrumentation-demo:3475b65f
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        RELEASE_VERSION: dynamic-instrumentation-demo
        RELEASE_REVISION: 3475b65f
    privileged: true
    pid: host
    command: ["--config=/etc/obi/obi-config.yaml"]
    volumes:
      - ./obi-config.yaml:/etc/obi/obi-config.yaml:ro
      - /sys/kernel/security:/sys/kernel/security:ro
    depends_on:
      - checkout
      - inventory-java
      - inventory-node
      - collector

  ui:
    image: nginx:1.31.6-alpine@sha256:d10753d9289b8e3f884386351f73554ce72b631378949deddd75e83ee296c427
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ui:/usr/share/nginx/html:ro
    depends_on:
      - obi
      - tempo
    restart: unless-stopped

volumes:
  tempo-data:
