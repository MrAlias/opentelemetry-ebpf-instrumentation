services:
  app:
    build: ./app
    pid: host
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  obi:
    image: ${OBI_IMAGE:-otel/ebpf-instrument:v0.13.0@sha256:5e89d7478b5feeb8ee73881c58bfe5bb0ccb6dcd4f8cd62e30457aa6e6426adb}
    privileged: true
    pid: host
    environment:
      OTEL_SERVICE_NAME: obi-profile-demo
      OTEL_EBPF_EXECUTABLE_PATH: obi-profile-demo
      OTEL_EBPF_LOG_LEVEL: ${OBI_LOG_LEVEL:-INFO}
      OTEL_EBPF_TRACE_PRINTER: ${OBI_TRACE_PRINTER:-disabled}
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: 500ms
      OTEL_EBPF_BPF_FS_PATH: /sys/fs/bpf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://lgtm:4317
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/kernel/security:/sys/kernel/security:ro
    depends_on:
      - app
      - lgtm

  profiler:
    image: otel/opentelemetry-collector-ebpf-profiler:0.160.0@sha256:40bc11043fdef9f7744631d6ca60d44e63b4c2a356ec0a21a02a4a5f28ebff70
    command:
      - --config=/etc/profiler.yaml
      - --feature-gates=service.profilesSupport
    privileged: true
    pid: host
    environment:
      OBI_PROCESS_CTX: ${OBI_PROCESS_CTX:-true}
    volumes:
      - ./profiler.yaml:/etc/profiler.yaml:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /proc:/proc:ro
    depends_on:
      - obi

  lgtm:
    image: grafana/otel-lgtm:0.33.1@sha256:d6c52678ab5b7144f27ae569fd778608121c0f4a10eb411983750a0d67c1fbe3
    environment:
      GF_FEATURE_TOGGLES_ENABLE: profilesHeatmap
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./collector.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./pyroscope.yaml:/otel-lgtm/pyroscope-config.yaml:ro
      - ./datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
