events {}
http {
    log_format rpc '$connection $connection_requests $http_x_case_id';
    access_log /dev/stdout rpc;
    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        location / {
            grpc_set_header x-proxy-connection $connection;
            grpc_pass grpc://receiver:50051;
        }
    }
}
