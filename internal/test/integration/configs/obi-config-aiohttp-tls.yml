file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: aiohttp-source
tracer_provider:
  processors:
    - batch:
        schedule_delay: 100
        exporter:
          otlp_http:
            endpoint: http://jaeger:4318
extensions:
  obi:
    version: "2.0"
    capture:
      policy:
        default_action: exclude
        poll_interval: 500ms
      rules:
        - action: include
          name: aiohttp-source
          match:
            process:
              open_ports: "8080"
      instrumentation:
        http:
          enabled:
            traces: true
          track_request_headers: true
          routes:
            incoming:
              unmatched: path
            outgoing:
              unmatched: path
      engine:
        propagation:
          context_propagation: ${PROPAGATION:-headers}
          disable_black_box_cp: true
