file_format: "1.0"
log_level: debug
tracer_provider:
  processors:
    - batch:
        schedule_delay: 1
        exporter:
          otlp_http:
            endpoint: http://127.0.0.1:14395
extensions:
  obi:
    version: "2.0"
    capture:
      runtimes:
        java:
          enabled: true
          attach_timeout: 60s
      policy:
        default_action: exclude
        poll_interval: 500ms
      rules:
        - action: include
          match:
            process:
              exe_path_glob: ["*java"]
              open_ports: 8080
              cmd_args_glob: ["*HttpClient5Service*"]
      engine:
        propagation:
          context_propagation: "${HTTPCLIENT5_PROPAGATION:-headers}"
        batching:
          batch_timeout: 10ms
      instrumentation:
        http:
          track_request_headers: true
          routes:
            incoming:
              unmatched: path
