file_format: "1.0"
log_level: debug
resource:
  attributes:
    - name: service.name
      value: httpx-source
tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_http:
            endpoint: http://jaeger:4318
        schedule_delay: 100
extensions:
  obi:
    version: "2.0"
    capture:
      policy:
        default_action: exclude
        poll_interval: 500ms
      rules:
        - action: include
          match:
            process:
              open_ports: 8080
      instrumentation:
        http:
          track_request_headers: true
          routes:
            incoming:
              unmatched: path
            outgoing:
              unmatched: path
      engine:
        propagation:
          context_propagation: ${HTTPX_PROPAGATION}
          disable_black_box_cp: true
