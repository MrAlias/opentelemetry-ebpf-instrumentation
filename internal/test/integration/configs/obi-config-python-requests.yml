file_format: "1.0"
tracer_provider:
  processors:
    - batch:
        schedule_delay: 100
        exporter:
          otlp_http:
            endpoint: http://jaeger:4318
extensions:
  obi:
    version: "2.0"
    capture:
      policy:
        default_action: exclude
        poll_interval: 100ms
        min_process_age: 0s
      rules:
        - action: include
          match:
            process:
              open_ports: "8080"
      engine:
        propagation:
          context_propagation: "${REQUESTS_PROPAGATION:-headers}"
          disable_black_box_cp: true
        batching:
          batch_timeout: 10ms
      instrumentation:
        http:
          track_request_headers: true
          routes:
            discovery:
              disabled_languages: [python]
            incoming:
              unmatched: path
            outgoing:
              unmatched: path
