services:
  source:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/aiohttp_tls/Dockerfile
    image: hatest-aiohttp-tls
    command: [app.py, source]
    environment:
      PROXY_URL: https://proxy:8443

  proxy:
    image: hatest-aiohttp-tls
    command: [app.py, proxy]
    environment:
      PORT: "8443"
      DOWNSTREAM_URL: http://downstream:8081
    depends_on: [source]

  downstream:
    image: hatest-aiohttp-tls
    command: [app.py, downstream]
    environment:
      PORT: "8081"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on: [source, jaeger]

  obi:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/obi/Dockerfile
    image: hatest-obi-aiohttp-tls
    command: [--config=/configs/obi-config-aiohttp-tls.yml]
    privileged: true
    pid: service:source
    network_mode: service:source
    volumes:
      - ./configs:/configs:ro
      - ./system/sys/kernel/security_none:/sys/kernel/security
      - ../../../testoutput:/coverage
    environment:
      PROPAGATION: ${PROPAGATION:-headers}
    depends_on: [source, jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.60@sha256:4fd2d70fa347d6a47e79fcb06b1c177e6079f92cba88b083153d56263082135e
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  check:
    image: hatest-aiohttp-tls
    command: [check.py]
    environment:
      PROPAGATION: ${PROPAGATION:-headers}
    depends_on: [obi, proxy, downstream]
