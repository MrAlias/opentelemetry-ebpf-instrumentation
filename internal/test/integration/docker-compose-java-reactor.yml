services:
  source:
    image: hatest-java-reactor
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/java_tls/reactor/Dockerfile
    ports:
      - "28380:28380"
    environment:
      OTEL_SERVICE_NAME: reactor-source
      PORT: "28380"

  proxy:
    image: hatest-java-reactor-peer
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/java_tls/reactor/peer/Dockerfile
    environment:
      ROLE: proxy
    volumes:
      - ./components/pythonserver:/cert:ro

  downstream:
    image: hatest-java-reactor-peer
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/java_tls/reactor/peer/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports:
      - "28686:16686"
      - "24318:4318"

  obi:
    image: ${REACTOR_OBI_IMAGE:-hatest-obi-javaagent}
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/obi/Dockerfile-with-javaagent
    privileged: true
    network_mode: host
    pid: host
    volumes:
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /sys/fs/cgroup:/sys/fs/cgroup
    environment:
      OTEL_EBPF_OPEN_PORT: "28380"
      OTEL_EBPF_EXECUTABLE_PATH: ".*/java$"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:24318
      OTEL_EBPF_BPF_TRACK_REQUEST_HEADERS: "true"
      OTEL_EBPF_BPF_CONTEXT_PROPAGATION: ${REACTOR_PROPAGATION:-headers}
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: 500ms
      OTEL_EBPF_BPF_BATCH_TIMEOUT: 100ms
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: 100ms
      OTEL_EBPF_ROUTES_UNMATCHED: path
      OTEL_EBPF_LOG_LEVEL: DEBUG
    depends_on:
      - source
      - jaeger
