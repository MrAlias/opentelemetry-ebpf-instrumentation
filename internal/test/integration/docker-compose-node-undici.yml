services:
  source:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/nodeundici/Dockerfile
    image: hatest-node-undici
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      OTEL_SERVICE_NAME: undici-source
    ports:
      - "127.0.0.1::8080"
    depends_on:
      - proxy

  proxy:
    image: hatest-node-undici
    command: ["node", "proxy.js"]
    depends_on:
      - downstream

  downstream:
    image: hatest-node-undici
    command: ["node", "downstream.js"]
    environment:
      OTEL_SERVICE_NAME: undici-downstream
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - jaeger

  obi:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/obi/Dockerfile
    image: hatest-obi
    privileged: true
    network_mode: service:source
    pid: service:source
    command: ["--config=/configs/obi-config-node-undici.yml"]
    volumes:
      - ./configs:/configs:ro
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-node-undici:/var/run/obi
    environment:
      GOCOVERDIR: /coverage
      OTEL_SERVICE_NAME: undici-source
      UNDICI_PROPAGATION: ${UNDICI_PROPAGATION:-headers}
    depends_on:
      - source

  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports:
      - "127.0.0.1::16686"
