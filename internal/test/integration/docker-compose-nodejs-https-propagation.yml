services:
  source:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/nodejsserver/Dockerfile_https
    image: hatest-node-https
    command: [node, https_source.js]
    ports: ["8397:3030"]
    depends_on: [proxy, jaeger]

  proxy:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/nodejsserver/Dockerfile_https
    image: hatest-node-https
    command: [node, https_proxy.js]
    depends_on: [downstream]

  downstream:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/go_otel/Dockerfile
    image: hatest-node-https-downstream
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://jaeger:4318
      OTEL_BSP_SCHEDULE_DELAY: "100"
    depends_on: [jaeger]

  obi:
    build:
      context: ../../..
      dockerfile: internal/test/integration/components/obi/Dockerfile
    image: hatest-obi-node-https
    command: [--config=/configs/obi-config-nodejs-https-propagation.yml]
    privileged: true
    network_mode: service:source
    pid: service:source
    volumes:
      - ./configs:/configs:ro
      - ./system/sys/kernel/security_none:/sys/kernel/security
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-nodejs-https:/var/run/obi
    environment:
      GOCOVERDIR: /coverage
      # Header-only propagation: TCP options cannot bridge the TLS proxy.
      NODE_HTTPS_PROPAGATION: "${NODE_HTTPS_PROPAGATION:-headers}"
    depends_on: [source]

  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports: ["16697:16686"]
